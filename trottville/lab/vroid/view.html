<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRoid look</title>
<style>html,body{margin:0;height:100%;background:#e9eeec}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas>
<script type="module">
import * as T from '../../vendor/three-0.180.0/three.module.js';
import {GLTFLoader} from '../../vendor/three-0.180.0/addons/loaders/GLTFLoader.js';
const cv=document.getElementById('c'),r=new T.WebGLRenderer({canvas:cv,antialias:true});r.outputColorSpace=T.SRGBColorSpace;r.setPixelRatio(2);

setInterval(frame,200);
</script></body></html>

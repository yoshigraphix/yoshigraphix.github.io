<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rider Base · outfits</title>
<style>
:root{--bg:#f3efe8;--ink:#23402f;--card:#fffaf0;--line:#e3dccb;--acc:#2c5e45}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{margin:4px 0 2px;font-size:26px}p.sub{margin:0 0 12px;color:#5b6d60}
#stage{position:relative;height:62vh;min-height:420px;border-radius:22px;overflow:hidden;background:linear-gradient(#e9eeec 70%,#ddd5c2 70%)}

.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:600 15px system-ui}

</style></head><body><main>
<h1>Rider base</h1><p class="sub">VRoid body and face, with our outfits and hairstyles as layers on top. Each piece bends with the rig and takes any colour.</p>
<div id="stage"><canvas id="c"></canvas><div id="loading">Loading…</div></div>
<div class="row" id="cams"></div>

<section><h2>Top</h2><div class="row" id="s-top"></div><div class="row" id="c-top"></div></section>
<section><h2>Bottoms</h2><div class="row" id="s-bottom"></div><div class="row" id="c-bottom"></div></section>
<section><h2>Shoes</h2><div class="row" id="s-shoes"></div><div class="row" id="c-shoes"></div></section>
<section><h2>Helmet</h2><div class="row" id="s-helmet"></div><div class="row" id="c-helmet"></div></section>
<section><h2>Expression</h2><div class="row" id="exprs"></div></section>
<section><h2>Pose</h2><div class="row" id="poses"></div></section>
<section><h2>Skin</h2><div class="row" id="skin"></div></section>
<section><h2>Hairstyle</h2><div class="row" id="styles"></div></section>
<section><h2>Hair colour</h2><div class="row" id="hair"></div></section>
<section><h2>Eye colour</h2><div class="row" id="eyes"></div></section>
<section><h2>Undergarments</h2><div class="row" id="top"></div></section>
</main>

const SKINS=['#fff0e6','#fde6da','#f1c9a8','#d9a37a','#a8704a','#6e452c'];

#include <beginnormal_vertex>

  vertexShader:`#include <common>
#include <skinning_pars_vertex>
uniform float uW;void main(){

// ---------- outfits ----------
const SLOTS={top:[['none','None'],['tee','T-shirt'],['longtee','Long sleeve'],['jacket','Show jacket']],
  bottom:[['none','None'],['breeches','Breeches'],['jeans','Jeans'],['shorts','Shorts']],
  shoes:[['none','None'],['tallboots','Tall boots'],['paddock','Paddock boots'],['sneakers','Sneakers']],
  helmet:[['none','Off'],['helmet','Helmet']]};
const SLOT_OF={};for(const k in SLOTS)for(const [id] of SLOTS[k])if(id!=='none')SLOT_OF[id]=k;
const COLS={top:['#f4f1ea','#3b5b8c','#e98aa0','#3d7a52','#c94a3a','#2b2b2b','#f2c14e','#7b5ea7'],
  bottom:['#efe6d2','#f4f1ea','#4a6a9a','#2e3f5c','#6b5a45','#2b2b2b','#8a9a5b','#e98aa0'],
  shoes:['#2b2220','#5b3a26','#8a5a32','#f4f1ea','#c94a3a','#3b5b8c'],
  helmet:['#2b2b2b','#23324f','#5b3a26','#f4f1ea','#e98aa0','#3d7a52']};
const wear={top:'tee',bottom:'breeches',shoes:'tallboots',helmet:'none'};
const SLOTCOL={top:new T.Color(COLS.top[0]),bottom:new T.Color(COLS.bottom[0]),shoes:new T.Color(COLS.shoes[0]),helmet:new T.Color(COLS.helmet[0])};
const PRESETS={riding:{name:'Riding',wear:{top:'tee',bottom:'breeches',shoes:'tallboots',helmet:'helmet'},col:{top:'#3b5b8c',bottom:'#efe6d2',shoes:'#2b2220',helmet:'#2b2b2b'}},
  show:{name:'Show',wear:{top:'jacket',bottom:'breeches',shoes:'tallboots',helmet:'helmet'},col:{top:'#23324f',bottom:'#f4f1ea',shoes:'#2b2220',helmet:'#23324f'}},
  casual:{name:'Casual',wear:{top:'tee',bottom:'jeans',shoes:'sneakers',helmet:'none'},col:{top:'#e98aa0',bottom:'#4a6a9a',shoes:'#f4f1ea',helmet:'#2b2b2b'}},
  summer:{name:'Summer',wear:{top:'tee',bottom:'shorts',shoes:'sneakers',helmet:'none'},col:{top:'#f2c14e',bottom:'#8a9a5b',shoes:'#f4f1ea',helmet:'#2b2b2b'}},
  under:{name:'Undergarments',wear:{top:'none',bottom:'none',shoes:'none',helmet:'none'},col:{}}};
const CL={};
function vis(o,v){o.visible=v;if(o.userData.ol)o.userData.ol.visible=v;}
function applyWear(){const hel=wear.helmet!=='none';
  for(const st in SH)for(const o of SH[st])vis(o,st===look.style&&!hel);for(const st in SHH)for(const o of SHH[st])vis(o,st===look.style&&hel);for(const id in CL){const on=id==='undertop'?wear.top==='none':id==='underbottom'?wear.bottom==='none':wear[SLOT_OF[id]]===id;CL[id].visible=on;CL[id].userData.ol.visible=on;}}
const meshes=[];g.scene.traverse(o=>{if(o.isMesh)meshes.push(o);});
const SH={},SHH={},FACE=[];let tSkin=null,tIris=null;
for(const o of meshes){const n=o.name,mn=o.material.name,map=o.material.map;o.frustumCulled=false;
  if(o.morphTargetDictionary&&o.morphTargetDictionary.Fcl_EYE_Close!=null)FACE.push(o);
  if(/^SHH?_/.test(n)){const st=mn.slice(5),bag=n.startsWith('SHH_')?SHH:SH;(bag[st]=bag[st]||[]).push(o);o.material=toon('shair');o.userData.ol=outline(o,.0030);continue;}
  if(mn.startsWith('Cloth_')){const id=mn.slice(6);CL[id]=o;const col=/^under/.test(id)?U.uTop.value:SLOTCOL[SLOT_OF[id]];o.material=toon('cloth',null,col);o.material.side=T.DoubleSide;o.userData.ol=outline(o,/^under/.test(id)?.0025:.0032);}
  else if(/Body_00_SKIN/.test(mn)){tSkin=map;o.material=toon('skin',map);outline(o,.0036);}
  else if(/Face_00_SKIN|FaceMouth/.test(mn)){o.material=toon('face',map);if(/Mouth/.test(mn))o.renderOrder=1;}
  else if(/EyeWhite/.test(mn)){o.material=toon('white',map);o.renderOrder=1;}
  else if(/EyeIris/.test(mn)){tIris=map;o.material=toon('iris',map);o.renderOrder=2;}
  else if(/EyeHighlight/.test(mn)){o.material=toon('over',map);o.renderOrder=4;}
  else if(/FaceEyeline/.test(mn)){o.material=toon('over',map);o.renderOrder=3;}

const EXPR={neutral:{},happy:{Fcl_ALL_Joy:1},fun:{Fcl_ALL_Fun:1},surprised:{Fcl_ALL_Surprised:1},sad:{Fcl_ALL_Sorrow:1},angry:{Fcl_ALL_Angry:1}};
const cur={};let lastT=0;
function face(t){const dt=Math.min(.1,Math.max(0,t-lastT));lastT=t;const want=EXPR[look.expr]||{};
  const names=new Set([...Object.keys(cur),...Object.keys(want)]);for(const k of names){const w=want[k]||0;cur[k]=(cur[k]||0)+(w-(cur[k]||0))*(fixedT!=null?1:Math.min(1,dt*10));}

const sk=meshes.find(o=>o.isSkinnedMesh).skeleton,B={};const key=n=>n.replace(/\./g,'');for(const b of sk.bones)B[key(b.name)]=b;
g.scene.updateMatrixWorld(true);const rest={};for(const b of sk.bones){rest[b.name]={q:b.quaternion.clone(),w:b.getWorldQuaternion(new T.Quaternion())};}

chips($('skin'),SKINS.map((c,i)=>[c,'Skin '+(i+1)]),look.skin,v=>U.uSkin.value.set(v),true);

chips($('hair'),HAIRS.map((c,i)=>[c,'Hair '+(i+1)]),look.hair,v=>U.uHair.value.set(v),true);
